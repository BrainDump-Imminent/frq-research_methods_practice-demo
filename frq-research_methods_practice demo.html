const EXAM_MCQS = {u0:[{skill:"2.A",lo:"1.0.A: Determine the type of research design used.",topic:"Research Methods — Experimental Design",stem:"A school counselor wants to know whether mindfulness exercises reduce student anxiety. She randomly assigns 60 students to either a mindfulness group or a control group and measures anxiety scores before and after the six-week program. Which of the following best describes the research method used?",choices:["A correlational study, because the counselor is measuring the relationship between mindfulness and anxiety.","A quasi-experiment, because the participants were not randomly selected from the student population.","A true experiment, because the counselor manipulated the independent variable and used random assignment.","A naturalistic observation, because the counselor is observing student behavior in their natural school setting."],answer:"C",rationales:{A:"Incorrect. A correlation measures the relationship between two variables but does not involve manipulation of an IV or random assignment.",B:"Incorrect. A quasi-experiment lacks random assignment; this study used random assignment to groups.",C:"Correct. A true experiment requires manipulation of the IV (mindfulness exercises) and random assignment to conditions, both present here.",D:"Incorrect. Naturalistic observation involves watching behavior without any manipulation, which did not occur here."}},{skill:"2.B",lo:"1.0.B: Evaluate research design elements in experimental methodology.",topic:"Research Methods — Control",stem:"In a study examining whether background music improves math test scores, the researcher controls for noise level, lighting, and room temperature across both conditions. These controlled variables are best described as:",choices:["Independent variables, because the researcher is actively managing them.","Dependent variables, because they influence the outcome of the study.","Confounding variables that the researcher is attempting to eliminate.","Operational definitions of the dependent variable."],answer:"C",rationales:{A:"Incorrect. The IV is the presence/absence of music; these are not what the researcher is manipulating to test an effect.",B:"Incorrect. The DV is math test scores. Noise, lighting, and temperature are not being measured as outcomes.",C:"Correct. Potential confounds are variables other than the IV that could affect the DV. Controlling them helps ensure internal validity.",D:"Incorrect. Operational definitions specify how variables are measured, not what environmental factors are being held constant."}},{skill:"1.A",lo:"1.0.C: Apply psychological research concepts to a scenario.",topic:"Research Methods — Sampling",stem:"A researcher studying college student sleep habits surveys every third student on a dormitory mailing list. This method of selecting participants is best described as:",choices:["Convenience sampling, because the researcher is choosing participants based on ease of access.","Stratified sampling, because the population is divided before selection occurs.","Systematic sampling, because participants are chosen at regular intervals from a list.","Random sampling, because each participant has a chance of being selected."],answer:"C",rationales:{A:"Incorrect. Convenience sampling selects whoever is most accessible without a systematic interval process.",B:"Incorrect. Stratified sampling divides the population into subgroups and samples from each subgroup separately.",C:"Correct. Systematic sampling selects every nth individual from a list, which is exactly what this researcher is doing.",D:"Incorrect. While there is some randomness, this is technically systematic, not pure random sampling."}},{skill:"3.B",lo:"1.0.D: Calculate and interpret statistical measures.",topic:"Research Methods — Descriptive Statistics",stem:"A researcher reports that the mean test score for her sample is 78, and the standard deviation is 12. A student scored 90. Which of the following conclusions is most accurate?",choices:["The student scored below average because 90 is close to the mean.","The student scored one standard deviation above the mean.","The student scored two standard deviations above the mean.","The student's score is an outlier because it exceeds the mean."],answer:"B",rationales:{A:"Incorrect. 90 is above the mean of 78, not below it.",B:"Correct. One standard deviation above the mean = 78 + 12 = 90. The student's score places them exactly at +1 SD.",C:"Incorrect. Two standard deviations above would be 78 + 24 = 102.",D:"Incorrect. A score one SD above the mean is within the normal range; this is not an outlier by statistical convention."}},{skill:"2.C",lo:"1.0.E: Evaluate non-experimental research design elements.",topic:"Research Methods — Correlation",stem:"A researcher finds a strong positive correlation (r = +0.82) between hours of television watched per day and BMI in a sample of adults. Which of the following conclusions is best supported by this finding?",choices:["Watching television causes an increase in BMI due to physical inactivity.","There is a strong positive relationship between TV-watching hours and BMI in this sample.","Adults with higher BMI choose to watch more television to cope with health challenges.","Reducing television viewing is an effective intervention for reducing BMI."],answer:"B",rationales:{A:"Incorrect. Correlation does not allow causal conclusions; this is the third-variable or directionality problem.",B:"Correct. A correlational finding can only describe the direction and strength of the relationship, not establish causation.",C:"Incorrect. This proposes a specific causal direction — also not supported by correlational data alone.",D:"Incorrect. An intervention recommendation requires experimental evidence, not correlation."}},{skill:"2.D",lo:"1.0.F: Evaluate ethical procedures in research.",topic:"Research Methods — Ethics",stem:"Researchers at a university are studying stress responses by asking participants to complete a timed mathematics test in front of an audience. Participants are told beforehand that the study involves a problem-solving task but are not told an audience will be present. At the study's conclusion, researchers explain the true purpose. Which ethical procedure is illustrated by this conclusion step?",choices:["Informed consent, because researchers are giving participants information about the study.","Debriefing, because researchers are explaining the actual purpose and any deception after participation.","Confidentiality, because researchers are protecting participant information at study's end.","Institutional review, because an oversight board approved the study design."],answer:"B",rationales:{A:"Incorrect. Informed consent occurs before the study begins; this step occurs after the study ends.",B:"Correct. Debriefing involves explaining the true purpose of a study and clarifying any deceptions used, which happens after participation.",C:"Incorrect. Confidentiality refers to protecting participant data privacy, not explaining study purpose.",D:"Incorrect. Institutional review is conducted before the study, not after. It is not illustrated by the conclusion step."}},{skill:"3.C",lo:"1.0.G: Interpret data from graphs and figures.",topic:"Research Methods — Data Interpretation",stem:"A bar graph shows that students who slept 8 hours averaged a score of 85 on a memory test, while students who slept 4 hours averaged 68. The error bars for both groups overlap only slightly. Which conclusion is most appropriate?",choices:["Sleeping more hours causes better memory performance because the scores differ.","The difference in scores between the two sleep groups appears to be statistically meaningful.","Both groups performed essentially the same because the error bars overlap.","The results cannot be interpreted without knowing the correlation coefficient."],answer:"B",rationales:{A:"Incorrect. Bar graph data from a correlational study cannot support a causal claim; we do not know the research design here.",B:"Correct. Minimal overlap in error bars suggests the difference between means is likely statistically significant.",C:"Incorrect. Slight overlap does not mean the groups performed the same — it suggests the difference may be meaningful.",D:"Incorrect. Correlation coefficients apply to scatter plots, not bar graphs comparing group means."}},{skill:"1.B",lo:"1.0.H: Identify cognitive biases in research contexts.",topic:"Research Methods — Bias",stem:"After hearing that her college friends who exercised all got good grades, Tamara concludes that exercise must improve academic performance. Which cognitive bias best explains Tamara's reasoning?",choices:["Hindsight bias, because she is judging outcomes after they have already occurred.","Confirmation bias, because she is selectively noticing examples that match her pre-existing belief.","Availability heuristic, because memorable examples of exercising friends are easily retrieved.","Overconfidence, because she is overstating the reliability of her personal observation."],answer:"C",rationales:{A:'Incorrect. Hindsight bias involves claiming you "knew it all along" after learning an outcome, not selectively using anecdotes.',B:"Incorrect. Confirmation bias involves seeking out information that confirms beliefs — here she is not ignoring disconfirming evidence, she is using vivid examples as evidence.",C:"Correct. The availability heuristic leads people to judge likelihood based on how easily examples come to mind. Tamara's exercising friends are a vivid, memorable sample.",D:"Incorrect. Overconfidence involves overestimating knowledge or ability — she is making an inference from examples, not overestimating her knowledge."}},{skill:"2.A",lo:"1.0.I: Determine appropriate research design.",topic:"Research Methods — Design Selection",stem:"A developmental psychologist wants to study whether personality traits remain stable from age 20 to age 60 in the same individuals. Which research design is most appropriate?",choices:["Cross-sectional, because it allows comparison of different age groups efficiently.","Longitudinal, because the same participants need to be studied over a long period of time.","Quasi-experimental, because random assignment is not possible with age groups.","Naturalistic observation, because personality is best measured in natural environments."],answer:"B",rationales:{A:"Incorrect. Cross-sectional compares different people at one point in time, so it cannot track the same individuals over 40 years.",B:"Correct. Longitudinal design studies the same participants repeatedly over time, making it ideal for tracking changes within individuals.",C:"Incorrect. Quasi-experiments involve manipulating an IV without random assignment; this study is observational, not experimental.",D:"Incorrect. Naturalistic observation records behavior in natural settings but is not designed to track the same individuals across decades."}},{skill:"1.A",lo:"1.0.J: Apply statistical significance to findings.",topic:"Research Methods — Statistical Significance",stem:"A researcher reports that the difference in anxiety scores between her treatment and control groups is statistically significant (p = 0.03). Which interpretation is most accurate?",choices:["The treatment had a very large practical effect on anxiety scores.","There is only a 3% chance the observed difference is due to random chance if there is truly no effect.","The treatment is guaranteed to reduce anxiety in all future patients.","The effect is trivially small because the p-value is less than 0.05."],answer:"B",rationales:{A:"Incorrect. Statistical significance does not indicate the size of the effect; effect size is a separate calculation.",B:"Correct. A p-value of 0.03 means that if the null hypothesis were true, the probability of getting this result by chance is 3%, suggesting the difference is statistically meaningful.",C:"Incorrect. Statistical significance does not guarantee future results or allow generalizations beyond the study's sample.",D:"Incorrect. A p-value below 0.05 indicates significance, not trivialness; effect size (not p-value) indicates practical importance."}},{skill:"2.B",lo:"1.0.K: Evaluate experimental design elements.",topic:"Research Methods — Double-Blind Procedure",stem:"In a clinical trial for a new antidepressant, neither the patients nor the clinicians who assess their progress know which participants received the drug versus the placebo. This procedure is used to control for which of the following?",choices:["Sampling bias and lack of random selection.","The placebo effect and experimenter bias simultaneously.","Institutional review board requirements for ethical research.","Social desirability bias from participant self-reporting."],answer:"B",rationales:{A:"Incorrect. Double-blind procedure addresses knowledge of condition assignment, not sampling procedures.",B:"Correct. By keeping both patients and evaluators unaware of group assignment, double-blind controls for both the placebo effect (patients) and experimenter bias (evaluators).",C:"Incorrect. IRB requirements are about ethical oversight, not about awareness of group assignments.",D:"Incorrect. Social desirability bias (participants reporting what they think is expected) is different from placebo effects; double-blind does not directly address it."}},{skill:"3.A",lo:"1.0.L: Identify research concepts in scenarios.",topic:"Research Methods — Operational Definitions",stem:'A researcher studying academic performance defines "success" as scoring 80% or above on the final course examination. This is an example of:',choices:["A hypothesis, because it predicts the expected outcome of the study.","An independent variable, because it is what the researcher is testing.","An operational definition, because it provides a precise measurable definition of the variable.","A confounding variable, because it could influence the dependent variable."],answer:"C",rationales:{A:"Incorrect. A hypothesis is a testable prediction about the relationship between variables, not a definition of a variable.",B:'Incorrect. An IV is what the researcher manipulates; "success" here is the outcome being measured, not what is being manipulated.',C:'Correct. An operational definition states exactly how a concept will be measured in this specific study, allowing replication. Defining "success" as 80%+ is precisely that.',D:"Incorrect. A confound is an extraneous variable that may affect results; this is a definitional decision, not an uncontrolled external factor."}},{skill:"2.C",lo:"1.0.M: Evaluate non-experimental methodology limitations.",topic:"Research Methods — Case Study Limitations",stem:"A psychologist publishes an in-depth case study of a single patient who recovered from severe amnesia after a novel therapeutic approach. A critic argues the results cannot be applied to other patients. The critic is concerned about:",choices:["Internal validity, because the study lacks a control group.","Generalizability, because findings from one atypical case may not represent the broader population.","Reliability, because the study would produce different results if repeated.","Experimenter bias, because the psychologist is reporting on their own patient."],answer:"B",rationales:{A:"Incorrect. Internal validity concerns causal claims within the study, not whether results apply to other people.",B:"Correct. Case studies provide rich detail about one individual but cannot be reliably generalized to others, especially from an unusual case.",C:"Incorrect. Reliability concerns consistency of results across replications, not applicability to different populations.",D:"Incorrect. Experimenter bias is a concern, but the critic's stated concern is specifically about applying the findings to other patients."}},{skill:"1.A",lo:"1.0.N: Apply ethics to research scenarios.",topic:"Research Methods — Informed Consent & Assent",stem:"A researcher wants to study reading comprehension in 10-year-old children. She obtains written agreement from the children themselves that they are willing to participate. This ethical procedure is called:",choices:["Debriefing, because the researcher is explaining the procedure to participants.","Informed consent, because the participants are agreeing to take part in the research.","Informed assent, because the participants are minors who are legally unable to provide full consent.","Institutional review, because an oversight board must approve research with children."],answer:"C",rationales:{A:"Incorrect. Debriefing occurs after the study and involves explaining the purpose, not obtaining agreement to participate.",B:"Incorrect. Informed consent refers to legally binding agreement from adults who can consent; 10-year-olds cannot legally consent.",C:"Correct. Informed assent is the agreement from minors (who cannot legally consent) to participate, in addition to parental consent.",D:"Incorrect. IRB review is required, but what is described here is the participant agreement process, not oversight board approval."}},{skill:"3.B",lo:"1.0.O: Interpret measures of central tendency.",topic:"Research Methods — Mean, Median, Mode",stem:'A set of exam scores reads: 55, 60, 72, 72, 80, 92, 98. Which measure of central tendency best represents the "typical" student score, and why?',choices:["The mean, because it accounts for every score in the distribution.","The median, because it is not distorted by the extreme scores at either end.","The mode, because 72 appears most frequently and is the most common score.","The range, because it captures the full spread of scores in the distribution."],answer:"B",rationales:{A:"Incorrect. While the mean uses all scores, in a skewed distribution with extreme scores (55, 98) the mean can misrepresent the typical value.",B:'Correct. The median (72) is the midpoint of the distribution and is resistant to extreme values, making it the best measure of "typical" when outliers are present.',C:"Incorrect. The mode (72) only reflects the most frequent score, not necessarily the best single representation of all scores.",D:'Incorrect. The range is a measure of variability, not central tendency — it does not represent the "typical" score.'}}]};
const EXAM_FRQS = {u0:{title:"FRQ 1 — Article Analysis Question (AAQ)",points:8,intro:"Using the source provided, respond to all parts of the question.\n\nIntroduction\nResearchers examined the effects of classroom seating arrangement on academic engagement and quiz performance in high school students.\n\nParticipants\nParticipants were 147 students (73 male, 74 female) from six 10th-grade classrooms in two public high schools in the midwest United States. The average age was 15.6 years (SD = 0.71). All participants were from the same socioeconomic backgrounds (free and reduced lunch eligibility rates: 41% and 44% across the two schools).\n\nMethod\nResearchers randomly assigned classrooms to one of two seating conditions: traditional rows (facing forward) or collaborative clusters (groups of four desks). All other classroom factors (teacher, curriculum, lesson length) were held constant. Academic engagement was measured using a validated 12-item observation checklist completed by a trained observer unaware of the study hypothesis. Each student also completed a 15-item quiz at the end of each week over 8 weeks. The researchers obtained IRB approval, and all participants provided informed consent or informed assent.\n\nTable 1: Participant Demographics by Condition\nCondition | N | % Female | Mean Age\nRow seating | 74 | 49.3% | 15.5 yrs\nCluster seating | 73 | 50.7% | 15.7 yrs\n\nTable 2: Outcome Measures by Condition (Mean ± SD)\nMeasure | Row seating | Cluster seating\nWeekly quiz score (%) | 71.3 ± 9.4 | 78.1 ± 8.7\nAcademic engagement score | 62.4 ± 11.2 | 74.6 ± 9.8\n\nResults\nStudents in cluster seating scored significantly higher on weekly quizzes (p < .05) and showed significantly higher engagement scores (p < .01) than students in row seating. These differences held even after controlling for school, teacher, and student gender.",parts:[{label:"A",points:1,q:"Identify the research method used in this study.",rubric:'<strong>Earns 1 point:</strong> Accurately identifies the research method as an experiment (true experiment / experimental study).<br><em>Example:</em> "The researchers used an experimental method, because they manipulated the seating arrangement (IV) and randomly assigned classrooms to conditions."',helpOptions:[{text:"The researchers used a correlational study because they found a relationship between seating arrangement and quiz scores.",correct:!1,explain:"Incorrect — a correlational study only measures naturally occurring relationships without manipulation. The researchers actively manipulated seating and randomly assigned classrooms to conditions, which are the defining features of an experiment."},{text:"The researchers used an experiment because they randomly assigned classrooms to seating conditions (the IV) and measured quiz scores and engagement (the DVs).",correct:!0,explain:"Correct — a true experiment requires manipulation of an IV and random assignment to conditions. Both are present here. This allows causal conclusions about the effect of seating arrangement on performance."},{text:"The researchers used naturalistic observation because the students were observed in their real classrooms during normal school hours.",correct:!1,explain:"Incorrect — naturalistic observation means watching behavior without any manipulation. Here the researchers changed the seating arrangement, which is a manipulation. A real-world setting alone does not make a study naturalistic observation."},{text:"The researchers used a case study because they focused on a specific group of 147 students in two schools.",correct:!1,explain:"Incorrect — a case study is an in-depth investigation of a single individual or small group. This study compared two conditions across 147 participants with statistical analysis — that is an experiment, not a case study."}]},{label:"B",points:1,q:"State the operational definition of academic engagement as used in this study.",rubric:'<strong>Earns 1 point:</strong> States a specific measurable definition of academic engagement as it was measured in the study.<br><em>Example:</em> "Academic engagement was operationally defined as each student\'s score on a validated 12-item observation checklist completed by a trained observer." ',helpOptions:[{text:"Academic engagement was operationally defined as how much students participated in class discussions and raised their hands.",correct:!1,explain:"Incorrect — participation and hand-raising were not the measurement. The study used a specific validated checklist completed by an observer. Operational definitions must describe the actual tool used, not a plausible alternative."},{text:"Academic engagement was operationally defined as each student's score on a validated 12-item observation checklist completed by a trained observer who was unaware of the study hypothesis.",correct:!0,explain:"Correct — this captures every required element: the specific tool (12-item checklist), who completed it (trained observer), and the blinding procedure (unaware of hypothesis). All three are needed for a complete operational definition."},{text:"Academic engagement was operationally defined as each student's weekly quiz score out of 15 items.",correct:!1,explain:"Incorrect — quiz scores are a separate DV measuring academic performance, not engagement. The study measured both separately. Confusing the two earns zero points."},{text:"Academic engagement was operationally defined as the total time students spent paying attention during each lesson.",correct:!1,explain:"Incorrect — time-on-task was not described. The study used a 12-item standardized checklist. Always anchor your operational definition to the actual measurement tool described in the study."}]},{label:"C",points:1,q:"Describe the meaning of the standard deviation for the weekly quiz score in the row seating condition.",rubric:'<strong>Earns 1 point:</strong> Accurately describes what the SD of 9.4 means in context (spread/variability of scores around the mean of 71.3).<br><em>Example:</em> "A standard deviation of 9.4 indicates that most students in the row seating condition scored within about 9.4 percentage points above or below the mean score of 71.3%, showing the variability in that group\'s quiz performance."',helpOptions:[{text:"The SD of 9.4 means the row seating group scored 9.4 points lower than the cluster seating group on average.",correct:!1,explain:"Incorrect — that between-group difference is found by subtracting means (78.1 minus 71.3). Standard deviation describes spread within one group, not differences between groups."},{text:"The SD of 9.4 means most row seating students scored within approximately 9.4 percentage points of the group mean of 71.3%, indicating moderate variability within that group.",correct:!0,explain:"Correct — SD describes spread around the mean. About 68% of row seating students scored between roughly 61.9% and 80.7%. A larger SD indicates more variability; a smaller SD means scores cluster more tightly."},{text:"The SD of 9.4 means the row seating quiz results were not statistically significant.",correct:!1,explain:"Incorrect — standard deviation and statistical significance are entirely separate concepts. Significance is determined by p-values. The SD simply tells us how much scores in the row seating group varied around the mean of 71.3%."},{text:"The SD of 9.4 means 9.4% of students in the row seating group scored below passing on the quiz.",correct:!1,explain:"Incorrect — SD is not a percentage of students who failed. It is a measure of variability in the same units as the data. Knowing how many students scored below passing would require a specific cutoff score."}]},{label:"D",points:1,q:"Identify one ethical guideline described in the study. Describe one way the researchers applied it.",rubric:'<strong>Earns 1 point:</strong> Identifies one ethical guideline AND describes how it was applied.<br><em>Examples:</em> "The researchers obtained IRB approval, which means a professional board reviewed the study design to ensure it was ethical before it began." OR "Informed assent was obtained, meaning underage participants agreed to participate and knew they could stop at any time."',helpOptions:[{text:"Random assignment was the ethical guideline — it ensured every student had a fair chance to be in either condition.",correct:!1,explain:"Incorrect — random assignment is a methodological technique for controlling confounds, not an ethical guideline. Ethical guidelines address participant rights: informed consent, right to withdraw, IRB approval, confidentiality."},{text:"The researchers obtained IRB approval, meaning an independent review board examined the study design and confirmed it protected participants before data collection began.",correct:!0,explain:"Correct — IRB approval is a core APA ethical safeguard requiring independent review before the study begins. Identifying informed assent or consent also earns full credit here."},{text:"The researchers kept all quiz scores confidential, protecting students who performed poorly from embarrassment and harm.",correct:!1,explain:"Plausible but not explicitly described in the study. Earn this point by identifying a guideline clearly stated or implied in the passage — IRB approval and informed assent are both explicitly mentioned."},{text:"The researchers used a double-blind procedure so neither the students nor the teachers knew which seating condition they were in.",correct:!1,explain:"Incorrect — students and teachers clearly knew their seating condition. The observer was blind to the hypothesis, not the participants. Describing a procedure not present in the study earns no credit."}]},{label:"E",points:1,q:"Explain the extent to which the research findings may or may not be generalizable, using specific evidence from the study.",rubric:'<strong>Earns 1 point:</strong> Makes a claim about generalizability AND supports it with specific participant or methodological evidence.<br><em>Example:</em> "The findings may have limited generalizability because all participants were 10th-grade students from only two midwestern schools with similar SES backgrounds, leaving out students from other grade levels, regions, or socioeconomic contexts."',helpOptions:[{text:"The findings are fully generalizable because random assignment was used, which makes the results representative of all students.",correct:!1,explain:"Incorrect — random assignment improves internal validity (causal conclusions), not external validity (generalizability). Generalizability depends on who was sampled — 10th graders from two midwestern schools."},{text:"Generalizability is limited because all 147 participants were 10th-grade students from two midwestern schools with similar SES backgrounds, so results may not apply to other grade levels, regions, or socioeconomic groups.",correct:!0,explain:"Correct — earns the point with a specific claim (limited) backed by specific evidence from the study (grade level, two schools, region, SES similarity). Both the claim and specific evidence are required."},{text:"The findings cannot be generalized because 147 students is too small a sample to draw any valid conclusions.",correct:!1,explain:"Incorrect — 147 is a reasonable sample size. Generalizability is about who the participants were, not just how many. A large sample from the same narrow population would still have limited generalizability."},{text:"The findings are generalizable because both schools had similar demographics, showing the sample was well-balanced internally.",correct:!1,explain:"Incorrect — similar demographics across schools actually narrows generalizability. It means findings apply to that specific type of school, not a broader and more diverse population."}]},{label:"F",points:2,q:"Using at least one specific result from the study, explain whether the findings support or refute the idea that physical learning environment affects student academic performance.",rubric:'<strong>Earns 2 points:</strong> Uses at least one specific result AND accurately interprets it in relation to the claim about learning environment and academic performance.<br><em>Example:</em> "The findings support the idea that physical environment affects academic performance because students in cluster seating scored significantly higher on weekly quizzes (78.1%) than students in row seating (71.3%), and the difference was statistically significant (p &lt; .05), suggesting the seating arrangement — part of the physical environment — influenced quiz scores." <br><em>Note: 1 point for specific result, 1 point for accurate interpretation linking result to the claim.</em>',helpOptions:[{text:"The findings support the idea. Students in cluster seating scored significantly higher on quizzes (78.1% vs 71.3%, p < .05) and engagement (74.6 vs 62.4, p < .01). Since classrooms were randomly assigned, the seating arrangement — a physical feature of the environment — caused these improvements.",correct:!0,explain:"Correct — earns both points: specific statistics (78.1% vs 71.3%, p < .05; 74.6 vs 62.4, p < .01) and accurate causal interpretation linking the physical environment change to better outcomes via random assignment."},{text:"The findings support the idea because cluster seating students did better on everything, which shows changing the physical environment makes students smarter.",correct:!1,explain:"Incorrect — seating did not make students smarter. It affected quiz performance and engagement in this context. Also lacks specific statistics needed to earn full credit."},{text:"The findings do not support the idea because the study only used 10th graders, so we cannot claim physical environment matters for all students.",correct:!1,explain:"Incorrect — generalizability limits are separate from what the findings show. Within this sample, the significant difference between conditions does support the claim that physical environment affects performance."},{text:"The findings are inconclusive because students in both conditions scored below 80%, meaning neither arrangement produced truly excellent results.",correct:!1,explain:"Incorrect — the question asks whether environment affects performance, not whether performance was excellent. A statistically significant difference (p < .05) is meaningful evidence for the claim regardless of absolute score levels."}]}]}};

let examCurrentUnit=null,examTab="mcq",examMCQQueue=[],examMCQIndex=0,examMCQScore=0,examMCQAnswered=!1,examInited=!1;function initExamView(){examInited||(renderExamHome(),examInited=!0)}function renderExamHome(){const e=document.getElementById("exam-view");e&&(e.innerHTML=`\n    <div class="exam-home">\n      <div class="exam-home-hdr">\n        <h2>🧪 AP Psychology Exam Practice</h2>\n        <p>15 original MCQs + 1 FRQ per unit · Format modeled on AP Psychology CED 2024 · All questions are original</p>\n      </div>\n      <div class="exam-unit-grid">\n        ${EXAM_UNITS.map(e=>`\n          <div class="exam-unit-card" onclick="loadExamUnit('${e.id}')" style="border-color:${e.color}22">\n            <div class="exam-unit-tag" style="background:${e.color}18;color:${e.color}">${e.tag}</div>\n            <div class="exam-unit-name">${e.label}</div>\n            <div class="exam-unit-sub">15 MCQs · 1 FRQ · ${"u0"===e.id?"Research Methods":"u1"===e.id?"Biological Bases":"u2"===e.id?"Cognition":"u3"===e.id?"Development & Learning":"u4"===e.id?"Social Psychology & Personality":"Mental & Physical Health"}</div>\n          </div>\n        `).join("")}\n      </div>\n      <div style="font-size:0.98rem;color:#9490a8;border-top:1px solid #e8e7e0;padding-top:12px">\n        <strong>How to use:</strong> Select a unit → choose MCQ or FRQ tab → practice in AP exam format. MCQs show detailed rationales for all choices. FRQs include scoring rubrics for each part.\n      </div>\n    </div>\n  `)}function loadExamUnit(e){examCurrentUnit=e,examTab="mcq",renderExamArena(),startExamMCQ();const t=EXAM_UNITS.find(t=>t.id===e);t&&tmrSetContext("exam:"+e,t.label)}function renderExamArena(){const e=document.getElementById("exam-view"),t=EXAM_UNITS.find(e=>e.id===examCurrentUnit);e.innerHTML=`\n    <div class="exam-arena">\n      <div class="exam-nav-bar">\n        <h2 style="color:${t.color}">${t.label}</h2>\n        <button class="exam-back" onclick="renderExamHome()">← All Units</button> const EXAM_FRQS_EBQ={u0:{title:"FRQ 2 — Evidence-Based Argument Question (EBQ)",points:7,prompt:"Using the three sources provided, develop and justify an argument about which research method provides the strongest evidence for drawing conclusions about the causes of human behavior.",sources:[{label:"Source 1",title:"Study on Screen Time and Childhood Aggression",body:"In a 3-year longitudinal survey study, parents of 1,840 children (ages 4–10) reported their children's daily screen time and rated their aggressive behavior at three annual time points. Researchers found that higher reported screen time at Year 1 was positively associated with parent-reported aggression at Years 2 and 3 (r = +0.41 and r = +0.38). The researchers note that all measures were parent-reported and that family environment variables such as parenting stress and household conflict were not controlled for in the initial analyses. When controlling for parenting stress, the association between screen time and aggression was reduced but remained significant. The researchers concluded that screen time may be a risk factor for childhood aggression but acknowledged that directionality cannot be confirmed."},{label:"Source 2",title:"Randomized Controlled Trial on Mindfulness Training and Stress",body:"A randomized controlled trial assigned 240 college students to either an 8-week mindfulness-based stress reduction (MBSR) program or a waitlist control group. Students were randomly assigned to conditions. Trained instructors delivered the MBSR curriculum; waitlist participants received no intervention. Before and after the 8-week period, both groups completed a validated stress questionnaire. Students in the MBSR group showed significantly lower stress scores at post-test compared to waitlist participants. The researchers used random assignment, standardized delivery of the intervention, and blind raters to score questionnaires. They concluded that MBSR caused a reduction in perceived stress in this student sample."},{label:"Source 3",title:"Case Study of a Patient with Severe Anterograde Memory Impairment",body:"Neuropsychologists conducted an in-depth, decade-long investigation of a single patient, referred to as Patient H.M., who underwent surgical removal of his medial temporal lobes at age 27 as treatment for severe epilepsy. Prior to the surgery, H.M. had no pre-existing memory deficits. Following the surgery, H.M. showed a complete inability to form new episodic (autobiographical) memories while retaining intact language, spatial reasoning, and procedural skills. Researchers administered over 200 standardized assessments across 10 years. The findings contributed significantly to scientific understanding of the anatomical basis of episodic versus procedural memory systems. The researchers note that findings from a single unique case cannot be directly generalized to other individuals or groups."}],parts:[{label:"A",points:1,q:"Propose a specific and defensible claim about which research method provides the strongest evidence for drawing causal conclusions about human behavior.",rubric:'<strong>Earns 1 point:</strong> Proposes a specific, defensible claim relevant to the question. A claim that earns the point does not need to be supported yet — it just needs to be a clear, arguable position.<br><br><em>Examples that earn 1 point:</em><br>• "Experimental research provides the strongest evidence for causal conclusions about human behavior because it is the only method that can control for confounds."<br>• "True experiments are the most powerful method for establishing cause-and-effect relationships in psychology."<br>• "While case studies offer deep insight, experiments provide stronger causal evidence due to their use of controlled conditions and random assignment."',helpOptions:[{text:"Correlational research provides the strongest evidence because it collects data from large, real-world samples and can track patterns across time.",correct:!1,explain:"This does not earn Part A as the best-supported claim. Correlational research cannot establish causation — Source 1 itself acknowledges that directionality cannot be confirmed and that family environment variables were not fully controlled. Any specific, arguable claim earns the point, but this one is the hardest to defend using these sources."},{text:"Experimental research provides the strongest evidence for causal conclusions about human behavior because random assignment controls for confounds and isolates cause-and-effect.",correct:!0,explain:"Correct — this is a specific, defensible claim that earns Part A. Experiments like Source 2's RCT use random assignment to ensure group differences result from the intervention. This is the most defensible stance given all three sources, as Source 2 explicitly concludes causation while Sources 1 and 3 cannot."},{text:"Case study research provides the strongest evidence because it allows deep, detailed investigation of a single individual over many years.",correct:!1,explain:"This earns Part A as a specific, arguable claim. However, Source 3 explicitly acknowledges that findings from a single unique case cannot be generalized — making it harder to defend as the strongest method for causal conclusions across human behavior. Any specific, arguable stance earns the point."},{text:"No single research method is strongest because each has unique strengths and weaknesses that depend on the research question.",correct:!1,explain:"Incorrect — this does not earn Part A because it avoids taking a specific, defensible position. The question asks you to argue for one method. A non-answer that refuses to commit to a claim cannot earn the point."}]},{label:"B(i)",points:1,q:"Support your claim using at least one piece of specific and relevant evidence from one of the sources. You must cite the source.",rubric:'<strong>Earns 1 point:</strong> Provides specific, accurate evidence from a correctly cited source. Citing the source title alone or paraphrasing inaccurately does not earn the point.<br><br><em>Examples that earn 1 point:</em><br>• "According to Source 2, researchers who used random assignment and a controlled intervention found that MBSR caused a significant reduction in stress compared to the waitlist control group."<br>• "Source 1 found a positive association between screen time and aggression (r = +0.41), but because no variables were manipulated, the researchers acknowledged that directionality could not be confirmed."',helpOptions:[{text:"According to Source 2, random assignment to an 8-week MBSR program produced significantly lower stress scores at post-test compared to waitlist controls, and the researchers concluded that MBSR caused a reduction in perceived stress.",correct:!0,explain:"Correct — this earns Part B(i). The citation directly references Source 2's use of random assignment and accurately represents the researchers' causal conclusion. It names the source, provides specific evidence, and uses accurate details from the study."},{text:"Source 1 found that higher screen time at Year 1 was positively correlated with aggression at Years 2 and 3 (r = +0.41 and +0.38), proving that screen time causes children to become more aggressive.",correct:!1,explain:"Incorrect — this misrepresents the source. Source 1 explicitly states that directionality cannot be confirmed. Citing a correlation as proof of causation introduces a factual error that would not earn credit for Part B(i)."},{text:"Source 3 demonstrated that Patient H.M.'s decade-long case study produced landmark findings about hippocampal function, making in-depth investigation the strongest research approach.",correct:!1,explain:"Incorrect — Source 3 is a case study and explicitly notes that findings from a single unique case cannot be generalized. It does not support the claim that experimental research is strongest."},{text:"Source 1 used a large sample of 1,840 children, making its findings more reliable and representative than the smaller experimental study in Source 2.",correct:!1,explain:"Incorrect — a large sample in a correlational study does not establish causal conclusions. Source 1 still cannot confirm directionality or rule out third variables. This argument does not support experimental research as the strongest method."}]},{label:"B(ii)",points:2,q:"Explain how the evidence from Part B(i) supports your claim using a psychological perspective, theory, concept, or research finding from AP Psychology.",rubric:'<strong>Earns 2 points:</strong> Correctly interprets the evidence AND applies an appropriate psychological concept. 1 point for interpretation only, 2 points for interpretation + correct concept application.<br><br><em>Examples that earn 2 points:</em><br>• "This supports the claim that experiments provide the strongest causal evidence because random assignment — used in Source 2 — eliminates pre-existing differences between groups, meaning the observed change in stress can only be attributed to the MBSR program itself. This directly addresses the third-variable problem, which limits correlational designs like Source 1 where uncontrolled factors such as parenting stress could explain the screen time–aggression association."<br>• "The fact that Source 1 researchers acknowledge they cannot confirm directionality illustrates the directionality problem inherent in correlational research — we cannot tell whether screen time causes aggression, or whether aggressive children are given more screen time by frustrated parents. Only an experiment like Source 2 can resolve this."',helpOptions:[{text:"This supports the claim because the experiment used random assignment and standardized delivery, ensuring the only systematic difference between groups was the MBSR intervention — so observed differences in stress scores can be attributed to the treatment itself rather than pre-existing differences.",correct:!0,explain:"Correct — this earns Part B(ii). The explanation directly links methodological features (random assignment, standardized delivery) to the logical basis for causal inference. It explains the mechanism, not just restates the finding."},{text:"This supports the claim because correlation coefficients like r = +0.41 show a very strong relationship between variables, which for practical purposes is equivalent to a causal relationship.",correct:!1,explain:"Incorrect — this misunderstands correlation. A strong correlation coefficient does not indicate causation. Source 1 itself states directionality cannot be confirmed. This reasoning would not earn Part B(ii)."},{text:"This supports the claim because the MBSR study was conducted at a university, which ensures higher scientific standards than community-based studies.",correct:!1,explain:"Incorrect — institutional setting does not determine whether a study can draw causal conclusions. The explanation must connect specific methodological controls (random assignment, blind raters) to the logic of causal inference."},{text:"This supports the claim because experiments are the gold standard in all sciences, which proves they produce the strongest evidence.",correct:!1,explain:"Incorrect — this reasoning is circular and not based on the source. The explanation must connect specific features of Source 2's design to why experimental evidence supports causal conclusions. General appeals to authority do not earn credit."}]},{label:"C(i)",points:1,q:"Support your claim using an additional piece of specific and relevant evidence from a DIFFERENT source than the one used in Part B(i). You must cite the source.",rubric:'<strong>Earns 1 point:</strong> Provides different specific, accurate evidence from a different correctly cited source.<br><br><em>Examples that earn 1 point:</em><br>• "Source 3 describes a detailed case study of Patient H.M., who showed a complete inability to form new autobiographical memories after hippocampal damage, while retaining language and procedural skills intact across 10 years of assessment."<br>• "According to Source 1, when family environment variables like parenting stress were controlled for, the association between screen time and aggression was reduced, suggesting a possible confounding variable in the original findings."',helpOptions:[{text:"However, Source 1 showed that even a large longitudinal study with over 1,800 participants could not confirm directionality, suggesting that correlational methods used widely in real-world research have clear causal limits that also apply to some experimental designs.",correct:!1,explain:"Partially valid, but this mostly confirms the superiority of experiments rather than challenging it. Part B(iii) should present evidence that directly challenges your claim. Source 3 presents a stronger alternative perspective for this unit."},{text:"However, Source 3's decade-long case study of Patient H.M. produced foundational insights about the hippocampus and episodic memory that could not have been obtained through a randomized experiment — because the specific brain injury cannot be ethically or practically induced in a laboratory.",correct:!0,explain:"Correct — this earns Part B(iii). It accurately cites Source 3 and identifies a genuine challenge to experimental research: ethical and practical constraints mean that some of the most important questions in psychology cannot be studied experimentally, giving non-experimental methods irreplaceable scientific value."},{text:"However, Source 2 acknowledged that its sample was limited to college students, which means the findings cannot be generalized to other populations.",correct:!1,explain:"This is a real limitation of Source 2 but it does not constitute a strong alternative perspective for Part B(iii). The sample limitation doesn't challenge whether experiments are strongest in principle — only whether this particular experiment generalized broadly."},{text:"However, all three sources acknowledge limitations, so no research method can be trusted to draw conclusions about human behavior.",correct:!1,explain:"Incorrect — dismissing all sources is not a valid alternative perspective. Part B(iii) requires a specific, source-based challenge to your claim, not a general dismissal of all evidence."}]},{label:"C(ii)",points:2,q:"Explain how the evidence from Part C(i) supports your claim using a DIFFERENT psychological perspective, theory, concept, or research finding than the one used in Part B(ii).",rubric:'<strong>Earns 2 points:</strong> Correctly interprets the evidence AND applies a different appropriate psychological concept.<br><br><em>Examples that earn 2 points:</em><br>• "While Source 3\'s case study of H.M. provided groundbreaking insight into hippocampal function, its findings cannot support causal conclusions because the \'injury\' was not experimentally manipulated — it was a naturally occurring event. This illustrates a fundamental limitation of case study methodology: without experimental control, we cannot rule out alternative explanations. An experiment can establish causation precisely because all conditions except the independent variable are held constant, making it the gold standard for causal inference in science."<br>• "The case study in Source 3 demonstrates the value of naturalistic observation of rare cases, but it also shows the limits of generalizability — as the researchers themselves note, findings from one unique patient cannot be extended to others. This highlights why sampling and control are important in psychological research: a well-designed experiment with representative random assignment allows conclusions to extend beyond a single participant."',helpOptions:[{text:"While case studies like Source 3 provide irreplaceable insight into rare phenomena, their findings cannot be generalized across the population. Experiments sacrifice depth for breadth, but when the goal is establishing causes that apply broadly to human behavior, controlled experimental designs with random assignment remain the strongest available method.",correct:!0,explain:"Correct — this earns Part B(iv). It acknowledges the legitimate strength of case studies (depth, ecological validity for rare events) and then directly addresses the tradeoff: for causal conclusions that generalize across people, experimental control is necessary. It reasserts the claim while engaging honestly with the counterargument."},{text:"The alternative perspective is incorrect because experiments are superior to case studies in every way, so Source 3 adds nothing of scientific value.",correct:!1,explain:"Incorrect — dismissing an alternative without acknowledging its merits does not earn Part B(iv). An effective rebuttal must engage with the specific strength raised by the counterargument before reasserting the original claim."},{text:"Since Source 3 cannot be generalized, it proves that experimental research is right and case studies are always wrong.",correct:!1,explain:"Incorrect — this overstates the conclusion and misunderstands the purpose of case studies. Part B(iv) should acknowledge why Source 3 presented a legitimate challenge, then explain why experiments are still strongest for causal conclusions despite that challenge."},{text:"The ten years of data collection in Source 3 compensates for the lack of generalizability, so the rebuttal is not convincing.",correct:!1,explain:"Incorrect — the duration of data collection does not resolve the generalizability limitation of single case studies. This reasoning fails to engage with the actual logical challenge raised in Part B(iii) and would not earn Part B(iv)."}]}]},u1:{title:"FRQ 2 — Evidence-Based Argument Question (EBQ)",points:7,prompt:"Using the three sources provided, develop and justify an argument about whether biological or environmental factors play a greater role in shaping human behavior and mental processes.",sources:[{label:"Source 1",title:"Twin Study on Heritability of Major Depression",body:"A large population-based twin registry study compared rates of major depression in 4,200 identical (monozygotic) and fraternal (dizygotic) twin pairs. Researchers found that when one identical twin had major depression, the other had it approximately 37% of the time. For fraternal twins, the concordance rate was approximately 26%. Using quantitative genetic modeling, researchers estimated the heritability of major depression at approximately 37–42%, meaning genetic factors account for roughly 37–42% of the variance in depression risk. The remaining variance was attributed to individual-specific environmental experiences (such as personal trauma or life stressors) and shared family environment. Researchers noted that even with a genetic predisposition, environmental triggers are required for most people to develop the disorder."},{label:"Source 2",title:"Neuroimaging Study on Effects of Childhood Adversity on Brain Structure",body:"Researchers used MRI to compare brain structure in 95 adults who had experienced significant childhood adversity (abuse, neglect, or parental loss before age 12) with 95 adults matched for age, sex, and education who had not experienced childhood adversity. Adults with childhood adversity showed significantly smaller hippocampal volumes and greater amygdala reactivity to emotional stimuli compared to controls. The researchers noted that the hippocampus is highly sensitive to stress hormones (glucocorticoids) released during prolonged childhood stress. They concluded that early adverse environments physically alter brain structure in ways that persist into adulthood, suggesting that environmental experiences shape the biological substrate of behavior."},{label:"Source 3",title:"Review on Gene-Environment Interactions in Anxiety",body:"A review of 62 studies on the development of anxiety disorders found that having a variant of the serotonin transporter gene (5-HTTLPR short allele) was associated with increased anxiety sensitivity — but only in individuals who had also experienced high-stress life events. In low-stress environments, carriers of the short allele showed no significantly elevated anxiety compared to those without it. Conversely, individuals in high-stress environments without the genetic variant showed elevated anxiety but at lower rates than those with both the genetic variant and high stress. The reviewers concluded that neither genes nor environment alone determines anxiety outcomes — rather, the interaction between genetic predisposition and environmental conditions is the strongest predictor of anxiety disorder development."}],parts:[{label:"A",points:1,q:"Propose a specific and defensible claim about whether biological or environmental factors play a greater role in shaping human behavior and mental processes.",rubric:'<strong>Earns 1 point:</strong> Proposes a specific, defensible claim.<br><br><em>Examples that earn 1 point:</em><br>• "Biological and environmental factors interact to shape human behavior, and neither operates independently."<br>• "Environmental factors play an equally important role as biology in shaping behavior, as shown by research on brain plasticity and gene-environment interactions."<br>• "Both biological predisposition and environmental experience are necessary for most psychological outcomes, making an interactionist view most defensible."',helpOptions:[{text:"Biological factors are more important because genes are fixed at birth and cannot be changed, so they have a stronger influence on outcomes than the environment.",correct:!1,explain:"This is a defensible claim that earns Part A. However, Source 1 shows heritability for depression is only 37-42%, meaning environment explains the majority of variance. Any specific arguable stance earns the point — just defend it with evidence."},{text:"Neither biology nor environment alone determines behavior — both interact, as demonstrated by gene-environment interaction research and the effects of childhood adversity on brain structure.",correct:!0,explain:"Correct — specific, defensible interactionist claim. Commits to a position (interaction model) and previews the evidence. This is the most defensible stance given all three sources."},{text:"Environmental factors are more important because behavior is learned and can be changed through experience, while genes cannot.",correct:!1,explain:"This is a defensible claim that earns Part A. Source 2's findings about environment reshaping brain structure can support it. Any specific arguable position earns the point — commit and defend."},{text:"The nature vs. nurture debate is impossible to resolve because biology and environment are completely inseparable from each other.",correct:!1,explain:"Incorrect — while interactions make separation difficult, the sources do quantify relative contributions and show specific gene-environment patterns. Saying the question is unresolvable avoids taking a position."}]},{label:"B(i)",points:1,q:"Support your claim using at least one piece of specific and relevant evidence from one of the sources. You must cite the source.",rubric:'<strong>Earns 1 point:</strong> Provides specific, accurate evidence from a correctly cited source.<br><br><em>Examples that earn 1 point:</em><br>• "According to Source 3, the serotonin transporter gene variant was only associated with elevated anxiety in individuals who also experienced high-stress life events — in low-stress environments, the genetic variant produced no significant increase in anxiety."<br>• "Source 1 found that identical twins showed only 37–42% heritability for major depression, meaning the majority of the variance in depression risk is explained by environmental rather than genetic factors."',helpOptions:[{text:"Source 3 found that the serotonin transporter gene variant only predicted significantly elevated anxiety in individuals who also experienced high-stress life events — carriers in low-stress environments showed no significant increase in anxiety.",correct:!0,explain:"Correct — cites Source 3 with specific evidence (gene variant + high stress = elevated anxiety; gene alone = no significant effect). Directly supports an interactionist claim."},{text:"Source 1 found that the heritability of depression is 37-42%, which proves genes are the primary driver of mental health outcomes.",correct:!1,explain:"Incorrect — 37-42% heritability means genes account for roughly that proportion of variance. It does NOT mean genes are primary. The remaining 58-63% is environmental. Misinterpreting heritability is a common AP exam error."},{text:"Source 2 proves that environment shapes the brain because adults who experienced childhood adversity had smaller hippocampal volumes.",correct:!1,explain:"Incorrect — 'proves' overstates what a correlational design can show. Source 2 found an association, not proof of causation. Use precise language: 'was significantly associated with.'"},{text:"Research on the nature-nurture debate shows that both genes and the environment contribute to psychological traits and outcomes.",correct:!1,explain:"Incorrect — general background knowledge without citing a specific source. B(i) requires naming Source 1, 2, or 3 and providing a specific finding from it."}]},{label:"B(ii)",points:2,q:"Explain how the evidence from Part B(i) supports your claim using a psychological perspective, theory, concept, or research finding from AP Psychology.",rubric:'<strong>Earns 2 points:</strong> Correctly interprets the evidence AND applies a different appropriate psychological concept.<br><br><em>Examples that earn 2 points:</em><br>• "This supports an interactionist view because it demonstrates the diathesis-stress model in action: the genetic variant (diathesis) creates a vulnerability, but environmental stress (stressor) is required to activate it. This means that biology sets the stage but environment determines whether a disorder develops — neither factor is sufficient alone."<br>• "The fact that even identical twins — who share 100% of their genetic material — show only a 37% concordance rate for depression (Source 1) demonstrates that genes alone cannot determine behavior. This is consistent with the nature-nurture interactionist perspective, which holds that genetic predispositions require environmental conditions to be expressed."',helpOptions:[{text:"This supports the claim because we have always known that both nature and nurture matter, and this source confirms that.",correct:!1,explain:"Incorrect — too vague. Apply the diathesis-stress model or epigenetics to explain HOW the gene-environment interaction produces anxiety outcomes and why this supports an interactionist claim."},{text:"This supports the interactionist claim because it demonstrates the diathesis-stress model: the gene variant (diathesis — biological vulnerability) only produces elevated anxiety when combined with environmental stress. Neither factor alone was sufficient, showing biology and environment must interact rather than operating independently.",correct:!0,explain:"Correct — earns both points: accurate interpretation (gene only matters in high-stress environments) and application of the diathesis-stress model as the explanatory concept."},{text:"This supports the claim because serotonin is the 'feel-good' neurotransmitter, and people with the short allele variant produce less serotonin, making them more prone to anxiety.",correct:!1,explain:"Incorrect — this background knowledge about serotonin does not explain how the interaction finding supports an interactionist claim. Apply the diathesis-stress model to connect the evidence to the concept."},{text:"This supports the claim because a meta-analysis of 62 studies is more reliable than a single study, giving it more weight.",correct:!1,explain:"Incorrect — reliability speaks to the quality of the finding, not the mechanism. Apply a named concept explaining WHY genes and environment interact to produce psychological outcomes."}]},{label:"C(i)",points:1,q:"Support your claim using an additional piece of specific and relevant evidence from a DIFFERENT source than the one used in Part B(i). You must cite the source.",rubric:'<strong>Earns 1 point:</strong> Provides different specific, accurate evidence from a different correctly cited source.<br><br><em>Examples that earn 1 point:</em><br>• "Source 2 found that adults who experienced childhood adversity showed measurably smaller hippocampal volumes and greater amygdala reactivity compared to adults without such adversity — physical brain differences attributable to early environmental experience."<br>• "According to Source 1, researchers noted that even individuals with a genetic predisposition to depression typically require environmental triggers to develop the disorder."',helpOptions:[{text:"Source 2 found that adults who experienced significant childhood adversity showed significantly smaller hippocampal volumes and greater amygdala reactivity compared to matched controls who had not experienced adversity.",correct:!0,explain:"Correct — cites a different source with specific evidence (smaller hippocampus, greater amygdala reactivity, compared to matched controls). Shows environment physically alters brain structure, supporting an interactionist view."},{text:"Source 3 also shows that environmental stressors affect mental health outcomes when combined with genetic vulnerabilities.",correct:!1,explain:"Incorrect — C(i) must cite a DIFFERENT source than B(i). If you used Source 3 in B(i), you cannot cite it again."},{text:"Decades of adoption and twin studies have established that both genes and environment contribute significantly to psychological traits.",correct:!1,explain:"Incorrect — this is background knowledge without citing a provided source. C(i) must name Source 1, 2, or 3 with a specific finding."},{text:"Source 1 found that identical twins had only 37% concordance for depression while fraternal twins had 26%, showing genes do matter but do not determine outcomes alone.",correct:!1,explain:"Accurate evidence — but check whether you used Source 1 in B(i). If so, you must use a different source. C(i) must cite a different source than B(i)."}]},{label:"C(ii)",points:2,q:"Explain how the evidence from Part C(i) supports your claim using a DIFFERENT psychological perspective, theory, concept, or research finding than the one used in Part B(ii).",rubric:'<strong>Earns 2 points:</strong> Correctly interprets evidence AND applies a different appropriate psychological concept.<br><br><em>Examples that earn 2 points:</em><br>• "Source 2\'s finding that childhood adversity physically alters hippocampal volume and amygdala reactivity supports the interactionist position by demonstrating neuroplasticity — the brain\'s ability to be structurally changed by experience. This shows that the environment does not merely trigger pre-existing biological traits; it actively reshapes the biological substrate of behavior itself. Environment and biology are therefore not independent forces competing against one another, but are continuously influencing each other."<br>• "This evidence illustrates epigenetics: adverse early environments can alter how genes are expressed — for example, by upregulating stress-hormone production — without changing the DNA sequence itself. The resulting changes in hippocampal structure show that environmental experience becomes biologically embedded, further supporting the view that biology and environment cannot be meaningfully separated."',helpOptions:[{text:"This further supports the claim because a difficult childhood is well-known to cause mental health problems later in life, showing environment matters.",correct:!1,explain:"Incorrect — too general, no named concept. Apply neuroplasticity or epigenetics to explain HOW childhood adversity physically altering brain structure supports an interactionist claim."},{text:"This further supports the interactionist claim because it demonstrates neuroplasticity — the brain's ability to be structurally changed by environmental experience. Adversity physically altering hippocampal volume shows that environment does not merely trigger pre-existing traits but actively reshapes biological substrate — a different mechanism from the diathesis-stress model in B(ii).",correct:!0,explain:"Correct — earns both points: accurate interpretation (adversity changes brain structure = environment reshapes biology) and application of neuroplasticity as a concept distinct from the diathesis-stress model."},{text:"This is the same point as B(ii) — both show that genes and environment together produce psychological outcomes.",correct:!1,explain:"Incorrect — C(ii) must use a different concept. Diathesis-stress (genetic vulnerability activated by stress) and neuroplasticity (environment physically restructuring the brain) are distinct mechanisms."},{text:"This supports the claim because Source 2 used MRI technology, which is the most scientifically advanced brain imaging method available.",correct:!1,explain:"Incorrect — technological sophistication does not explain the psychological mechanism. Apply neuroplasticity or epigenetics to explain why environmental adversity changing brain structure supports an interactionist view."}]}]},u2:{title:"FRQ 2 — Evidence-Based Argument Question (EBQ)",points:7,prompt:"Using the three sources provided, develop and justify an argument about whether people can reliably trust their own judgments and perceptions when making important decisions.",sources:[{label:"Source 1",title:"Research on Eyewitness Identification Accuracy",body:'Researchers conducted a meta-analysis of 30 studies involving over 5,000 eyewitnesses to staged crimes or filmed events. Witnesses were asked to identify the perpetrator from a lineup immediately after the event, one week later, and one month later. Overall accuracy at immediate testing was 54%; at one week it dropped to 41%; and at one month it dropped to 28%. Accuracy was further reduced when witnesses were exposed to post-event questioning that included suggestive details — for example, when investigators described the perpetrator as "nervous" before witnesses described what they saw, witnesses were significantly more likely to describe the perpetrator as appearing nervous even if their original description contained no such detail. The researchers concluded that eyewitness testimony is subject to significant error and is highly malleable in the face of post-event information.'},{label:"Source 2",title:"Study on Overconfidence in Expert Prediction",body:'Researchers followed 284 professional forecasters — including economists, political analysts, and public health officials — over 20 years, tracking 28,000 specific predictions they made about economic trends, election outcomes, and policy effects. The forecasters were also asked to rate their confidence in each prediction on a scale of 0–100%. Results showed that predictions rated as "90% certain" were correct only 70% of the time. Predictions rated "100% certain" were wrong approximately 15% of the time. The gap between expressed confidence and actual accuracy was largest for the most famous and publicly prominent experts, who tended to make bold, sweeping predictions with high stated certainty. The researchers concluded that expertise does not eliminate overconfidence and that confident-sounding judgments are systematically more certain than the evidence warrants.'},{label:"Source 3",title:"Experiment on the Influence of Framing on Financial Decisions",body:'Researchers presented 180 undergraduate students with a hypothetical financial decision. Half were told: "This investment has a 70% chance of yielding a gain." The other half were told: "This investment has a 30% chance of resulting in a loss." Both descriptions were mathematically identical. Students presented with the gain frame rated the investment as significantly more attractive and were more likely to choose it (68%) than students presented with the loss frame (41%). In a follow-up condition, participants who were shown both framings simultaneously still showed a preference for the gain-framed version when asked which sounded better, despite acknowledging the descriptions were equivalent. The researchers concluded that how information is presented — not just what information is presented — systematically biases judgment and decision-making.'}],parts:[{label:"A",points:1,q:"Propose a specific and defensible claim about whether people can reliably trust their own judgments and perceptions when making important decisions.",rubric:'<strong>Earns 1 point:</strong> Proposes a specific, defensible claim.<br><br><em>Examples that earn 1 point:</em><br>• "People cannot fully trust their own judgments and perceptions when making important decisions, because psychological biases systematically distort how we perceive and interpret information."<br>• "Human judgment is unreliable because perception is constructed rather than recorded — it is vulnerable to suggestion, framing effects, and overconfidence."<br>• "While people often feel confident in their perceptions and judgments, research demonstrates consistent and predictable errors that should make us cautious about trusting unexamined intuitions."',helpOptions:[{text:"People engage in unethical behavior because of poor moral character that was not developed properly during childhood and adolescence.",correct:!1,explain:"Incorrect — childhood development history is different from immediate situational forces. The sources focus on situational context (authority, role, organizational pressure) and present-moment traits, not developmental history."},{text:"Situational factors better explain why ordinary people engage in unethical behavior, as demonstrated by evidence that most people comply with authority and role demands even when doing so violates their personal values.",correct:!0,explain:"Correct — specific, defensible claim: names a factor, states comparative advantage, and previews the evidence. The most defensible position given Sources 1 and 2."},{text:"Both situational and dispositional factors are equally important and interact to produce unethical behavior.",correct:!1,explain:"While nuanced, this avoids a directional comparative position. A stronger claim: 'Both matter, but situational factors have stronger demonstrated influence.' Part A requires committing to a specific comparative stance."},{text:"Unethical behavior is best explained by moral disengagement — a cognitive tendency to rationalize harmful actions — which is a stable personality trait.",correct:!1,explain:"This is a defensible dispositional claim that earns Part A. However, Source 3 found situational pressure explained twice as much variance as moral disengagement. Any specific arguable claim qualifies — commit and support it."}]},{label:"B(i)",points:1,q:"Support your claim using at least one piece of specific and relevant evidence from one of the sources. You must cite the source.",rubric:'<strong>Earns 1 point:</strong> Specific, accurate, correctly cited evidence.<br><br><em>Examples that earn 1 point:</em><br>• "According to Source 1, eyewitness accuracy declined to just 28% after one month, and witnesses were significantly more likely to incorporate false details from post-event questioning into their accounts."<br>• "Source 2 found that expert forecasters who rated their predictions as \'100% certain\' were wrong approximately 15% of the time, demonstrating that confidence does not equal accuracy."',helpOptions:[{text:"According to Source 1, 65% of ordinary adults delivered what they believed were lethal-level shocks when instructed by an authority figure, and compliance dropped dramatically to approximately 20% when situational conditions changed — for instance, when the authority was physically absent.",correct:!0,explain:"Correct — cites Source 1 with specific statistics (65%, ~20%) and shows how varying the situation changed behavior — the strongest evidence for situational influence."},{text:"Milgram proved that humans are fundamentally obedient and will follow authority no matter what the consequences.",correct:!1,explain:"Incorrect — general background knowledge rather than evidence from a provided source. Also 'no matter what' is contradicted by the data: compliance dropped to ~20% when conditions changed."},{text:"Source 2 found that healthy students randomly assigned to the guard role became psychologically cruel within 36 hours, despite being screened as psychologically normal.",correct:!1,explain:"Strong evidence — but if you cited Source 1 in Part A, use Source 1 here for consistency. Save Source 2 for C(i)."},{text:"Source 3 showed that moral disengagement predicted unethical behavior, with higher scorers engaging in more boundary-pushing at work.",correct:!1,explain:"This supports dispositional factors, which undermines a situational claim. Use this as C(i) evidence to show that even the strongest dispositional predictor explains less variance than situational pressure."}]},{label:"B(ii)",points:2,q:"Explain how the evidence from Part B(i) supports your claim using a psychological perspective, theory, concept, or research finding from AP Psychology.",rubric:"<strong>Earns 2 points:</strong> Correctly interprets evidence AND applies a correct psychological concept.<br><br><em>Examples that earn 2 points:</em><br>• \"This supports the claim because it demonstrates the misinformation effect — post-event information from investigators altered witnesses' original perceptions. This happens because memory is constructive, not reproductive: each time a memory is retrieved, it can be modified by new information, which means eyewitnesses' subjective certainty about what they saw does not reflect the accuracy of what they actually encoded.\"<br>• \"Source 2's finding that professionals' predictions rated '100% certain' were wrong 15% of the time directly illustrates overconfidence — the well-documented tendency to believe we know more than we do. Because people cannot detect the gap between their felt certainty and actual accuracy, they are particularly vulnerable to this bias when stakes are highest.\"",helpOptions:[{text:"This supports the claim because when someone tells you to do something, you feel obligated to obey, especially if they seem to have authority.",correct:!1,explain:"Incorrect — informally restates the behavior without applying a named psychological concept. Apply obedience to authority and the fundamental attribution error to explain the mechanism."},{text:"This supports the situational claim because it demonstrates obedience to authority — a legitimate authority figure created situational pressure strong enough to override participants' personal moral dispositions. The fundamental attribution error explains why observers wrongly assume participants must have been cruel by nature, when the situation was the primary driver.",correct:!0,explain:"Correct — earns both points: accurate interpretation (authority overrode moral dispositions) and application of obedience to authority plus the fundamental attribution error."},{text:"This supports the claim because Milgram's participants were stressed and frightened, impairing their judgment and causing them to make poor ethical decisions.",correct:!1,explain:"Incorrect — stress and fear were not the key variables. The mechanism is obedience to a legitimate authority figure, not impaired judgment due to stress. Apply the named concept."},{text:"This proves that situations are always more powerful than individual character, which means people cannot be held responsible for behavior that occurs under authority.",correct:!1,explain:"Incorrect — this is a normative/legal argument rather than a psychological concept. Apply obedience to authority as the mechanism, not a philosophical claim about moral responsibility."}]},{label:"C(i)",points:1,q:"Support your claim using an additional piece of specific and relevant evidence from
